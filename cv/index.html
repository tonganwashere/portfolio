<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CV - Hor Tongan</title>
    <meta name="description" content="View and download my curriculum vitae." />
    <link rel="canonical" href="https://tongan.dev/cv" />

    <!-- Open Graph / Facebook / LinkedIn / Discord / Telegram -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tongan.dev/cv" />
    <meta property="og:title" content="CV - Hor Tongan" />
    <meta property="og:description" content="View and download my curriculum vitae." />
    <meta property="og:image" content="https://tongan.dev/cv/media/preview.jpg" />
    <meta property="og:site_name" content="Hor Tongan" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://tongan.dev/cv" />
    <meta name="twitter:title" content="CV - Hor Tongan" />
    <meta name="twitter:description" content="View and download my curriculum vitae." />
    <meta name="twitter:image" content="https://tongan.dev/cv/media/preview.jpg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="manifest" href="/assets/icons/site.webmanifest" />
        <link rel="stylesheet" href="/assets/css/output.css" />
    <script>
        const saved = localStorage.getItem("theme");
        if (saved === "light") document.documentElement.classList.remove("dark");
        else document.documentElement.classList.add("dark");
    </script>
</head>

<body class="bg-base text-primary font-sans antialiased min-h-screen flex flex-col">

    <!-- Navigation Bar -->
    <nav id="site-nav" class="sticky top-0 z-50 bg-base max-w-7xl mx-auto w-full px-6 py-5 flex items-center justify-between border-b border-line"></nav>

    <main class="max-w-7xl mx-auto w-full px-6 flex-1">

        <!-- Header + buttons -->
        <section class="pt-16 pb-10 border-b border-line">
            <h1 class="text-4xl font-medium mb-6">Curriculum Vitae</h1>
            <div class="flex flex-wrap gap-3">
                <a href="/cv/media/Hor_Tongan_CV.pdf" download="HorTongan_CV.pdf"
                    class="text-sm border border-line rounded px-4 py-2 text-sub hover:text-primary hover:border-muted transition-colors duration-150">
                    Download PDF ↓
                </a>

                <a href="/cv/media/Hor_Tongan_CV.pdf" target="_blank" rel="noopener noreferrer"
                    class="text-sm border border-line rounded px-4 py-2 text-sub hover:text-primary hover:border-muted transition-colors duration-150">
                    Open in new tab →
                </a>
            </div>
        </section>

        <!-- CV preview -->
        <section class="py-14">
            <div class="max-w-4xl mx-auto rounded-lg border border-line overflow-hidden bg-surface">
                <img src="/cv/media/preview.jpg?v=2" alt="Hor Tongan CV" width="800" height="1132"
                    class="w-full h-auto block" loading="eager" />
            </div>
        </section>

    </main>

    <footer class="max-w-7xl mx-auto w-full px-6 py-6 flex flex-wrap justify-between items-center gap-3 border-t border-line">
        <p class="text-sm text-muted">© 2026 Hor Tongan</p>
        <p class="text-sm text-muted">
            Designed and built from scratch ·
            <a href="https://github.com/tonganwashere/portfolio" target="_blank" rel="noopener noreferrer"
                class="hover:text-primary transition-colors duration-150 underline underline-offset-4 decoration-sub hover:decoration-primary">Source on GitHub</a>
        </p>
    </footer>

    <script src="/assets/js/nav.js"></script>
    <script src="/assets/js/footer.js"></script>
    <script src="/assets/js/theme.js"></script>
</body>

</html>
